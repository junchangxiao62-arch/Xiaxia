<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <title>Xiao AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101014;
      color: #f5f5f7;
      height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #15151b;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #303039;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9b5cff, #5135a8);
      display: grid;
      place-items: center;
      font-size: 21px;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #a5a5b5;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      background: #25252f;
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: #6941c6;
      border-bottom-right-radius: 5px;
    }

    .welcome {
      margin: auto 0;
      text-align: center;
      color: #aaaabd;
      line-height: 1.7;
    }

    .welcome h2 {
      color: #f5f5f7;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid #303039;
      background: #15151b;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      max-height: 120px;
      border: 1px solid #393944;
      border-radius: 22px;
      padding: 13px 15px;
      font: inherit;
      color: white;
      background: #22222b;
      outline: none;
    }

    textarea:focus {
      border-color: #9b5cff;
    }

    button {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: #8955e9;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="avatar">✦</div>
      <div>
        <h1>Xiao AI</h1>
        <p>Your personal AI · Interface preview</p>
      </div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>Welcome to Xiao AI</h2>
        <p>Your AI. Your experience.<br>
        Let's build something of our own.</p>
      </div>
    </section>

    <form id="chat-form">
      <textarea
        id="message-input"
        placeholder="Message Xiao AI..."
        rows="1"
        aria-label="Your message"
        required
      ></textarea>

      <button type="submit" aria-label="Send message">➤</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function addMessage(text, sender) {
      const message = document.createElement("div");
      message.className = "message " + sender;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      welcome?.remove();
      addMessage(text, "user");

      input.value = "";
      input.style.height = "auto";

      addMessage(
        "I'm here! My interface is working, but my AI brain hasn't been connected yet.",
        "bot"
      );
    });

    input.addEventListener("input", function() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
